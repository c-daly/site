<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_newlines | strip }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="identity">
          <span class="eyebrow">Alex Robbins</span>
          <h1>Emerging Tech Delivery Leader</h1>
        </div>
        <div class="cta-group">
          <a class="cta" href="mailto:alex@alexrobbins.dev">Book a working session</a>
          <a class="cta secondary" href="https://www.linkedin.com/in/alexmrobbins/" target="_blank" rel="noreferrer">LinkedIn</a>
        </div>
      </header>
      {{ content }}
      <footer class="site-footer">
        <p>© {{ 'now' | date: '%Y' }} Alex Robbins. Building AI governance, robotics, and agentic programs that ship.</p>
      </footer>
    </div>
  </body>
</html>
